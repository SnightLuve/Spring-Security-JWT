spring:
  application:
    name: Jwt
  profiles:
    default: dev
jwt:
  # In production set JWT_SECRET to a random Base64-encoded value of at least 32 bytes.
  secret: ${JWT_SECRET:ZGV2LXNlY3JldC1rZXktZm9yLWp3dC1zaWduaW5nLTIwMjY=}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    persist-authorization: true
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
